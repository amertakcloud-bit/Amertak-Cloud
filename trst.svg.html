<!DOCTYPE html>
<html>

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title></title>
</head>

<body>
 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Vibrant Yellow Gradient -->
    <linearGradient id="yellowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF300" />
      <stop offset="100%" stop-color="#D1BC00" />
    </linearGradient>
    <linearGradient id="yellowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF83B" />
      <stop offset="100%" stop-color="#CBB300" />
    </linearGradient>
    
    <!-- Glass Shell Gradient -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFE600" stop-opacity="0.08" />
    </linearGradient>

    <!-- Shadow Filter for 3D Effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Translucent Outer Hexagonal Shell -->
  <g filter="url(#shadow)">
    <path fill="url(#glassFill)" stroke="rgba(255, 255, 255, 0.35)" stroke-width="2" stroke-linejoin="round"
      d="M 230 75 
         L 285 130 
         L 285 190 
         L 335 140 
         L 425 230 
         L 425 285 
         L 295 415 
         L 210 330 
         L 210 270 
         L 155 325 
         L 75 245 
         L 75 190 
         Z" opacity="0.8" />
  </g>

  <!-- Main Interlocking Yellow N-Shape Elements -->
  <g filter="url(#shadow)">
    <!-- Top-Left Yellow Chevron -->
    <path fill="url(#yellowGrad1)" stroke="url(#yellowGrad1)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"
      d="M 220 95 L 285 160 L 285 230 L 235 190 L 235 315 L 165 260 L 165 200 Z" />
    
    <!-- Bottom-Right Yellow Chevron (Symmetric 180 deg) -->
    <path fill="url(#yellowGrad2)" stroke="url(#yellowGrad2)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"
      d="M 380 505 L 315 440 L 315 370 L 365 410 L 365 285 L 435 340 L 435 400 Z" />
  </g>
</svg>

</body>

</html>
